name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            keep: ownnas-windows-x86_64
            binary: target/release/ownnas.exe
          - os: ubuntu-24.04
            keep: ownnas-linux-x86_64
            binary: target/release/ownnas
          - os: ubuntu-24.04-arm
            keep: ownnas-linux-aarch64
            binary: target/release/ownnas
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release -p ownnas

      - name: Test
        run: cargo test --locked -p ownnas

      - name: Keep the Windows and Linux builds
        if: matrix.keep
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.keep }}
          path: ${{ matrix.binary }}
