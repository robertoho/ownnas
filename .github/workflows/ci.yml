name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only: Windows and macOS are built for releases (and macOS here, by hand).
          - os: ubuntu-24.04
            keep: ownnas-linux-x86_64
          - os: ubuntu-24.04-arm
            keep: ownnas-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release -p ownnas -p ownnas-mount

      - name: Test
        run: cargo test --locked -p ownnas -p ownnas-mount

      - name: Linux mount round trip
        timeout-minutes: 10
        run: |
          sudo apt-get install -y -q fuse3 attr
          BIN=target/release scripts/test-linux-mount.sh

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.keep }}
          path: |
            target/release/ownnas
            target/release/ownnas-mount
