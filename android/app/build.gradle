apply plugin: "com.android.application"

def repoDir = rootProject.projectDir.parentFile
def rustTargets = [
    "armeabi-v7a": [target: "armv7-linux-androideabi", linker: "armv7a-linux-androideabi26-clang", compiler: "armv7a-linux-androideabi26-clang"],
    "arm64-v8a":  [target: "aarch64-linux-android", linker: "aarch64-linux-android26-clang", compiler: "aarch64-linux-android26-clang"],
    "x86_64":     [target: "x86_64-linux-android", linker: "x86_64-linux-android26-clang", compiler: "x86_64-linux-android26-clang"]
]

android {
    namespace "com.ownnas"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.ownnas"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def hostOs = System.getProperty("os.name").toLowerCase()
def isWindows = hostOs.contains("windows")
// The NDK's folder for macOS is called x86_64 but its tools also run on Apple silicon.
def ndkHost = isWindows ? "windows-x86_64" : hostOs.contains("mac") ? "darwin-x86_64" : "linux-x86_64"
def clangSuffix = isWindows ? ".cmd" : ""
def rustupExecutable = isWindows ? "rustup.exe" : "rustup"
def cargoExecutable = isWindows ? "cargo.exe" : "cargo"
def targetNames = rustTargets.values().collect { it.target }

tasks.register("installRustAndroidTargets", Exec) {
    commandLine rustupExecutable, "target", "add"
    args targetNames
}

def rustTasks = []
rustTargets.each { abi, config ->
    def taskName = "buildRust${abi.replace('-', '_')}"
    def target = config.target
    def targetEnv = target.toUpperCase().replace('-', '_')
    def ccEnv = target.replace('-', '_')
    def ndkBin = file("${android.sdkDirectory}/ndk/${android.ndkVersion}/toolchains/llvm/prebuilt/${ndkHost}/bin")
    def linker = new File(ndkBin, config.linker + clangSuffix).absolutePath
    def compiler = new File(ndkBin, config.compiler + clangSuffix).absolutePath
    def llvmAr = new File(ndkBin, isWindows ? "llvm-ar.exe" : "llvm-ar").absolutePath
    def outputDir = file("${repoDir}/target/${target}/release")
    def jniDir = file("${projectDir}/src/main/jniLibs/${abi}")

    def rustTask = tasks.register(taskName, Exec) {
        dependsOn "installRustAndroidTargets"
        workingDir repoDir
        commandLine cargoExecutable, "build", "--lib", "--release", "--target", target
        environment "CARGO_TARGET_${targetEnv}_LINKER", linker
        environment "AR_${ccEnv}", llvmAr
        environment "CC_${ccEnv}", compiler
        environment "CXX_${ccEnv}", new File(ndkBin, config.compiler.replace("clang", "clang++") + clangSuffix).absolutePath
        doFirst {
            jniDir.mkdirs()
        }
        doLast {
            copy {
                from new File(outputDir, "libownnas.so")
                into jniDir
            }
        }
    }
    rustTasks << rustTask
}

tasks.named("preBuild").configure {
    dependsOn rustTasks
}
