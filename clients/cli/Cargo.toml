[package]
name = "ownnascli"
version = "0.9.6"
edition = "2021"
description = "Fast command-line file transfer for OwnNAS servers"

[[bin]]
name = "ownnascli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ownnas-core = { path = "../../crates/ownnas-core" }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
