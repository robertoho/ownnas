# The Xcode project is generated from this file with XcodeGen (`brew install xcodegen`, then
# `xcodegen` in this folder). Edit this file, not OwnNAS.xcodeproj.
name: OwnNAS
options:
  bundleIdPrefix: app.ownnas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OwnNAS:
    type: application
    platform: iOS
    sources:
      - path: OwnNAS
      # Generated by build-rust.sh (run before each build, below).
      - path: Generated/ownnas_ffi.swift
        optional: true
    dependencies:
      - framework: Generated/OwnNASCore.xcframework
        embed: false
    preBuildScripts:
      - name: Build the Rust client library
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/ownnas_ffi.swift
    info:
      path: OwnNAS/Info.plist
      properties:
        CFBundleDisplayName: OwnNAS
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: OwnNAS connects to your OwnNAS server on your home network or VPN.
        NSPhotoLibraryAddUsageDescription: OwnNAS saves the photos and videos you choose to your library.
        NSPhotoLibraryUsageDescription: OwnNAS backs up your photos and videos to your OwnNAS server.
        # Photo backup runs when iOS gives the app background time.
        UIBackgroundModes: [processing, fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.ownnas.ios.backup]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ownnas.ios
        PRODUCT_NAME: OwnNAS
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # The build script writes the Rust libraries and bindings next to the project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Rust library is built for Apple silicon simulators only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Walks through the app against a running server (see README.md); not run by default.
  OwnNASUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OwnNASUITests]
    dependencies:
      - target: OwnNAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ownnas.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
