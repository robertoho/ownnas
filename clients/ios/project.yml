# The Xcode project is generated from this file with XcodeGen (`brew install xcodegen`, then
# `xcodegen` in this folder). Edit this file, not OwnNAS.xcodeproj.
name: OwnNAS
options:
  bundleIdPrefix: app.ownnas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Shared by the app and its Files extension (the server list). Change it together with the
    # bundle identifiers if you build under your own.
    OWNNAS_APP_GROUP: group.app.ownnas.ios
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OwnNAS:
    type: application
    platform: iOS
    sources:
      - path: OwnNAS
      # Generated by build-rust.sh (run before each build, below).
      - path: Generated/ownnas_ffi.swift
        optional: true
    dependencies:
      - framework: Generated/OwnNASCore.xcframework
        embed: false
      - target: OwnNASFiles
    entitlements:
      path: OwnNAS/OwnNAS.entitlements
      properties: &shared-entitlements
        com.apple.security.application-groups: [$(OWNNAS_APP_GROUP)]
        # The first group is where Keychain items go by default: the tokens, shared this way.
        keychain-access-groups: [$(AppIdentifierPrefix)app.ownnas.shared]
    # The Rust library is built by OwnNASFiles, which is built first.
    info:
      path: OwnNAS/Info.plist
      properties:
        CFBundleDisplayName: OwnNAS
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: OwnNAS connects to your OwnNAS server on your home network or VPN.
        NSPhotoLibraryAddUsageDescription: OwnNAS saves the photos and videos you choose to your library.
        NSPhotoLibraryUsageDescription: OwnNAS backs up your photos and videos to your OwnNAS server.
        # Photo backup runs when iOS gives the app background time.
        UIBackgroundModes: [processing, fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.ownnas.ios.backup]
        ITSAppUsesNonExemptEncryption: false
        OwnNASAppGroup: $(OWNNAS_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ownnas.ios
        PRODUCT_NAME: OwnNAS
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # The build script writes the Rust libraries and bindings next to the project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Rust library is built for Apple silicon simulators only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The servers in the Files app.
  OwnNASFiles:
    type: app-extension
    platform: iOS
    sources:
      - path: OwnNASFiles
      - path: OwnNAS/Data/ServerStore.swift
      - path: Generated/ownnas_ffi.swift
        optional: true
    dependencies:
      - framework: Generated/OwnNASCore.xcframework
        embed: false
    entitlements:
      path: OwnNASFiles/OwnNASFiles.entitlements
      properties: *shared-entitlements
    # Built before the app, so it makes the Rust library and its bindings.
    preBuildScripts:
      - name: Build the Rust client library
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/ownnas_ffi.swift
    info:
      path: OwnNASFiles/Info.plist
      properties:
        CFBundleDisplayName: OwnNAS
        OwnNASAppGroup: $(OWNNAS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderDocumentGroup: $(OWNNAS_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ownnas.ios.files
        PRODUCT_NAME: OwnNASFiles
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
  # Walks through the app against a running server (see README.md); not run by default.
  OwnNASUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OwnNASUITests]
    dependencies:
      - target: OwnNAS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ownnas.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
