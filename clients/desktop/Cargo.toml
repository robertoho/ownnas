[package]
name = "ownnas-sync"
version.workspace = true
edition = "2021"
description = "Two-way folder sync client for an OwnNAS server"

[[bin]]
name = "ownnas-sync"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ownnas-core = { path = "../../crates/ownnas-core" }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
