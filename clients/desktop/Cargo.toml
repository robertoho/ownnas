[package]
name = "ownnas-sync"
version = "0.1.0"
edition = "2021"
description = "Two-way folder sync client for an OwnNAS server"

[[bin]]
name = "ownnas-sync"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand = "0.8"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
webpki-roots = "0.26"
