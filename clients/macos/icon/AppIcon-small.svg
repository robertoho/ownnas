<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20241c"/>
      <stop offset="1" stop-color="#111310"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3226"/>
      <stop offset="1" stop-color="#23261d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- The plate: Apple's grid, 824 of 1024 with the shadow below. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#shadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- Heavier lines: the size for 16 and 32 pixels. -->
  <rect x="239" y="367" width="546" height="290" rx="72" fill="none" stroke="#def25a" stroke-opacity="0.35" stroke-width="36" filter="url(#glow)"/>
  <rect x="239" y="367" width="546" height="290" rx="72" fill="url(#body)" stroke="#def25a" stroke-width="36"/>
  <rect x="300" y="494" width="300" height="36" fill="#6c7a58"/>
  <circle cx="696" cy="512" r="46" fill="#def25a"/>
</svg>
