# The Mac app: a menu bar app that signs in to OwnNAS servers and puts each in Finder's sidebar,
# where files appear without being downloaded and download when opened (a File Provider
# extension, the same as the iPhone app's Files location).
#
# The Xcode project is generated from this file with XcodeGen (`brew install xcodegen`, then
# `xcodegen` in this folder). Edit this file, not OwnNAS.xcodeproj.
name: OwnNAS
options:
  bundleIdPrefix: app.ownnas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signed with a Developer ID, to give out outside the App Store (notarized for release).
    # The App Group starts with the team ID, which needs no provisioning profile on the Mac.
    DEVELOPMENT_TEAM: K27HXR2Q62
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    OWNNAS_APP_GROUP: K27HXR2Q62.app.ownnas
    # The build script writes the Rust library and bindings next to the project.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
  configs:
    # Notarizing refuses apps that let debuggers attach (get-task-allow), which Xcode adds.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  OwnNAS:
    type: application
    platform: macOS
    sources:
      - path: OwnNAS
      - path: ../ios/OwnNAS/Data/ServerStore.swift
      # Generated by build-rust.sh (run before each build, by OwnNASFiles).
      - path: Generated/ownnas_ffi.swift
        optional: true
    dependencies:
      - framework: Generated/OwnNASCore.xcframework
        embed: false
      - target: OwnNASFiles
    entitlements:
      path: OwnNAS/OwnNAS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(OWNNAS_APP_GROUP)]
        # To read a server's ca.crt the person picks.
        com.apple.security.files.user-selected.read-only: true
    info:
      path: OwnNAS/Info.plist
      properties:
        CFBundleDisplayName: OwnNAS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A menu bar app: no Dock icon.
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: OwnNAS
        OwnNASAppGroup: $(OWNNAS_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ownnas.mac
        PRODUCT_NAME: OwnNAS
        # From icon/AppIcon.svg (and AppIcon-small.svg, with heavier lines, for 16 and 32 px).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The servers in Finder.
  OwnNASFiles:
    type: app-extension
    platform: macOS
    sources:
      - path: ../ios/OwnNASFiles
        excludes: ["*.plist", "*.entitlements"]
      - path: ../ios/OwnNAS/Data/ServerStore.swift
      - path: Generated/ownnas_ffi.swift
        optional: true
    dependencies:
      - framework: Generated/OwnNASCore.xcframework
        embed: false
    entitlements:
      path: OwnNASFiles/OwnNASFiles.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(OWNNAS_APP_GROUP)]
    # Built before the app, so it makes the Rust library and its bindings.
    preBuildScripts:
      - name: Build the Rust client library
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Generated/ownnas_ffi.swift
    info:
      path: OwnNASFiles/Info.plist
      properties:
        CFBundleDisplayName: OwnNAS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        OwnNASAppGroup: $(OWNNAS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FileProviderExtension
          NSExtensionFileProviderSupportsEnumeration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ownnas.mac.files
        PRODUCT_NAME: OwnNASFiles
