[package]
name = "ownnas-mount"
version = "0.1.0"
edition = "2021"
description = "OwnNAS servers as folders on Linux, with online-only files (FUSE)"

[[bin]]
name = "ownnas-mount"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ownnas-core = { path = "../../crates/ownnas-core" }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }
libc = "0.2"
