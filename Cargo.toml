[package]
name = "ownnas"
version = "0.4.0"
edition = "2021"
description = "Self-hosted folder browser with login, previews, and a SQLite database"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart", "ws"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
kamadak-exif = "0.6"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
mime_guess = "2"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "limits"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
xz2 = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
zip = "2"
lopdf = "0.34"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.9"

# Not on Intel Macs, where ONNX Runtime has no prebuilt library (see build.rs).
[target.'cfg(not(any(target_os = "android", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
# Smart photo search and faces (models are downloaded when switched on). Linked statically,
# so the server stays one file.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-31"] }
ndarray = "0.17"
regex = "1"

[profile.release]
lto = "thin"
strip = true

[workspace]
members = ["clients/desktop", "crates/ownnas-core", "crates/ownnas-ffi"]
