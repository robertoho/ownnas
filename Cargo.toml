[package]
name = "ownnas"
version = "0.5.0"
edition = "2021"
description = "Self-hosted folder browser with login, previews, and a SQLite database"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart", "ws"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
kamadak-exif = "0.6"
flate2 = "1"
fs4 = { version = "1", default-features = false, features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "tga", "dds", "exr", "hdr", "ico", "qoi", "pnm", "ff"] }
mime_guess = "2"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "limits"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
xz2 = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
zip = "2"
lopdf = "0.34"
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
lofty = "0.25"
roxmltree = "0.21"
cfb = "0.15"
calamine = { version = "0.36", default-features = false }
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd"] }
unrar = "0.5"
bzip2 = "0.5"
mail-parser = "0.11"
ttf-parser = "0.25"
icns = "0.5"
xcf = "0.4"
plist = { version = "1.10", default-features = false, features = ["serde"] }
parquet = { version = "60", default-features = false, features = ["snap", "flate2", "flate2-rust_backend", "lz4", "zstd", "brotli", "arrow"] }
arrow-ipc = "60"
arrow-cast = "60"
arrow-array = "60"
apache-avro = { version = "0.22", default-features = false }
djvu-rs = { version = "0.43", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.9"

# Not on Intel Macs, where ONNX Runtime has no prebuilt library (see build.rs).
[target.'cfg(not(any(target_os = "android", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
# Smart photo search and faces (models are downloaded when switched on). Linked statically,
# so the server stays one file.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-31"] }
ndarray = "0.17"
regex = "1"

[profile.release]
lto = "thin"
strip = true

[workspace]
members = ["clients/desktop", "crates/ownnas-core", "crates/ownnas-ffi"]
