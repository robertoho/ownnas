[package]
name = "ownnas-core"
version = "0.1.0"
edition = "2021"
description = "Client library for OwnNAS servers: the HTTP API, browsing, and two-way folder sync"

[dependencies]
hex = "0.4"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Terminals: the WebSocket client (TLS comes from rustls above) and the screen emulator.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
vt100 = "0.16"
webpki-roots = "0.26"
